<svg xmlns="http://www.w3.org/2000/svg" width="121.20068359375" height="44" viewBox="0 0 121.20068359375 44" role="img" aria-label="LinkedIn"><style>@font-face{font-family:'BM Sans';font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}
.drop{animation:drop .55s cubic-bezier(.3,1.35,.5,1) both}.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.rise,.drop,.pulse{animation:none}}</style><path d="M22,1H99.2Q120.2,1 120.2,22V22Q120.2,43 99.2,43H22Q1,43 1,22V22Q1,1 22,1Z" fill="none" stroke="#e3d9cc" stroke-width="2"/><text x="20" y="28" font-family="'BM Sans', Inter, 'Segoe UI', sans-serif" font-weight="800" font-size="15" fill="#1f1a16" >LinkedIn</text><path d="M91.2,27L101.2,17M94.2,17H101.2V24" stroke="#1f1a16" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
