<svg xmlns="http://www.w3.org/2000/svg" width="400" height="68" viewBox="0 0 400 68" role="img" aria-label="Made to order. Refreshed Nov 26, 2026."><style>@font-face{font-family:'BM Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}
.drop{animation:drop .55s cubic-bezier(.3,1.35,.5,1) both}.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.rise,.drop,.pulse{animation:none}}</style><g transform="translate(0,24)"><path d="M0,10H400" stroke="#e3d9cc" stroke-width="2" stroke-dasharray="6 6"/><text x="0" y="36" font-family="'BM Mono', 'JetBrains Mono', Consolas, monospace" font-weight="500" font-size="12" fill="#5f554b" >made to order · refreshed Nov 26, 2026</text></g></svg>
