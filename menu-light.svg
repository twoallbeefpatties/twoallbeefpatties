<svg xmlns="http://www.w3.org/2000/svg" width="880" height="102" viewBox="0 0 880 102" role="img" aria-label="The menu"><style>@font-face{font-family:'BM Display';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'BM Sans';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}
.drop{animation:drop .55s cubic-bezier(.3,1.35,.5,1) both}.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.rise,.drop,.pulse{animation:none}}</style><g transform="translate(0,44)"><text x="0" y="34" font-family="'BM Display', 'Archivo Black', Impact, sans-serif" font-weight="400" font-size="30" fill="#1f1a16" >The menu</text><text x="880" y="32" font-family="'BM Sans', Inter, 'Segoe UI', sans-serif" font-weight="400" font-size="13" fill="#5f554b" text-anchor="end">pick a number · each item opens its repo</text><path d="M0,57H880" stroke="#e3d9cc" stroke-width="2"/></g></svg>
