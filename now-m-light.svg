<svg xmlns="http://www.w3.org/2000/svg" width="400" height="92" viewBox="0 0 400 92" role="img" aria-label="Now cooking: nc-scripting-tool — Run N-able Scripting via Ecoverse"><style>@font-face{font-family:'BM Sans';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'BM Sans';font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'BM Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}
